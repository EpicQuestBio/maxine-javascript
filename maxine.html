<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Maxine's Quest</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.87.0/phaser.min.js"></script>
    <script src="constants.js"></script>
    <script src="util.js"></script>
    <script src="graphs.js"></script>
    <script src="controls.js"></script>
    <style type="text/css">
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body>

    <!-- Content that goes before the Maxine canvas. -->
    <select id="levelSelect" onChange="resetLevel()">
        <option value="1">Spores and Pores</option>
        <!--<option value="2">Mostly SpinShrooms</option>
        <option value="3">Introducing DoomShrooms</option>-->
        <!--<option value="4">Mushromancer and the Oysters</option>
        <option value="5">Mushromancer and the DoomShrooms</option>
        <option value="6">Mushromancer's Spiralling Spores</option>-->
        <option value="7">Labyrinth of the Dragon Tyrant</option>
    </select>
    Voltage<input id="voltage"></input>mV

    Signal Mode
    <select id="signalMode" onchange="setSignalMode(this.value)">
        <option value="random" selected>Random</option>
        <option value="live">Live Signal</option>
    </select>

    Signal server
    <input id="signalServerUrl" value="ws://localhost:8766" size="26" />
    <button type="button" onclick="connectSignalRing()">Connect Signal</button>
    <button type="button" onclick="disconnectSignalRing()">Disconnect</button>
    <span id="signalConnStatus">Disconnected</span>

    <marquee id="statusBar">Welcome to Maxine's Quest!</marquee>

    <div id="game-container"></div>

    <!-- This script sets up the canvas so put it where you want the canvas to be. :) -->
    <script src="maxine.js"></script>

</body>

</html>
