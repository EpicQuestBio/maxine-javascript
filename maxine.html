<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Maxine's Quest</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.87.0/phaser.min.js"></script>
    <script src="constants.js"></script>
    <script src="util.js"></script>
    <script src="signal_buffer.js"></script>
    <script src="graphs.js"></script>
    <script src="controls.js"></script>
    <style type="text/css">
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        * {
            box-sizing: border-box;
        }

        #mq-page {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: black;
        }

        #mq-toolbar {
            flex: 0 0 auto;
            height: 36px;
            max-height: 36px;
            width: 100%;
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            gap: 6px;
            padding: 3px 6px;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            background: #111;
            color: white;
            font-family: system-ui, sans-serif;
            font-size: 12px;
            line-height: 1;
            z-index: 10;
        }

        #mq-toolbar label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex: 0 0 auto;
            white-space: nowrap;
        }

        #mq-toolbar input,
        #mq-toolbar select,
        #mq-toolbar button {
            flex: 0 0 auto;
            font-size: 12px;
            height: 24px;
            max-height: 24px;
        }

        #voltage {
            width: 48px;
        }

        #signalServerUrl {
            width: 190px;
        }

        #signalConnStatus {
            flex: 0 0 auto;
            white-space: nowrap;
        }

        #statusBar {
            flex: 0 0 180px;
            height: 20px;
            max-width: 180px;
        }

        #game-container {
            flex: 1 1 auto;
            min-height: 0;
            min-width: 0;
            width: 100%;
            height: calc(100dvh - 36px);
            overflow: hidden;
            position: relative;
            background: black;
        }

        #game-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
        }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
</head>

<body>

    <!-- Content that goes before the Maxine canvas. -->
    <div id="mq-page">
        <div id="mq-toolbar">
            <select id="levelSelect" onChange="resetLevel()">
                <option value="1">Spores and Pores</option>
                <!--<option value="2">Mostly SpinShrooms</option>
                <option value="3">Introducing DoomShrooms</option>-->
                <!--<option value="4">Mushromancer and the Oysters</option>
                <option value="5">Mushromancer and the DoomShrooms</option>
                <option value="6">Mushromancer's Spiralling Spores</option>-->
                <option value="7">Labyrinth of the Dragon Tyrant</option>
            </select>
            Voltage<input id="voltage"></input>mV

            Signal Mode
            <select id="signalMode" onchange="setSignalMode(this.value)">
                <option value="random" selected>Random</option>
                <option value="live">Live Signal</option>
            </select>

            Signal server
            <input id="signalServerUrl" value="ws://localhost:8766" size="26" />
            <button type="button" onclick="connectSignalRing()">Connect Signal</button>
            <button type="button" onclick="disconnectSignalRing()">Disconnect</button>
            <span id="signalConnStatus">Disconnected</span>

            <marquee id="statusBar">Welcome to Maxine's Quest!</marquee>
        </div>
        <div id="game-container"></div>
    </div>

    <!-- This script sets up the canvas so put it where you want the canvas to be. :) -->
    <script src="maxine.js"></script>

</body>

</html>
